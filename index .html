<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GariFix – Ramani</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GariFix">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--y:#F26B0F;--k:#0B0F17;--bg:#F4F5F7;--card:#FFFFFF;--tx:#0B0F17;--mu:#6B7280;--ln:#E5E7EB;--ok:#16A34A}
@media (prefers-color-scheme: dark){:root{--bg:#0B0F17;--card:#151B26;--tx:#F3F4F6;--mu:#9CA3AF;--ln:#263041}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1000px 520px at 0% -8%,rgba(242,107,15,.20),transparent 60%),radial-gradient(900px 500px at 105% 105%,rgba(59,130,246,.13),transparent 60%),var(--bg);color:var(--tx);font-size:15px;line-height:1.45;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.22;z-index:-1;pointer-events:none;animation:float 14s ease-in-out infinite}
.b1{width:340px;height:340px;background:var(--y);top:-120px;left:-100px}
.b2{width:280px;height:280px;background:#3B82F6;bottom:-80px;right:-80px;animation-delay:-5s}
@keyframes float{50%{transform:translate(30px,-25px) scale(1.08)}}
header{background:var(--k);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.2)}
header .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header h1 span{color:var(--y)}
header small{display:block;opacity:.7;font-size:11px}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 11px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;transition:.3s}
.seg button.on{background:var(--y);color:var(--k)}
main{max-width:760px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;border-top:3px solid var(--y);animation:up .5s both}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 10px 28px rgba(15,23,42,.07);animation:up .5s both}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}

label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;transition:.25s}
.chip.on{background:var(--y);border-color:var(--y);color:var(--k);font-weight:600;transform:scale(1.04)}
.btn{background:var(--y);color:var(--k);border:0;padding:12px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 18px rgba(242,107,15,.35)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--k);color:#fff;box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;border-bottom:1px solid var(--ln);cursor:pointer;transition:background .2s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row.sel{background:rgba(242,107,15,.15)}
.row small{display:block;color:var(--mu)}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--ln);white-space:nowrap}
.tag.y{background:var(--y);color:var(--k);border-color:var(--y)}
.tag.g{color:var(--ok);border-color:var(--ok)}
#map{height:320px;width:100%;border-radius:12px;position:relative;z-index:0}
#mapWrap{position:relative}
#mapWrap.fs{position:fixed;inset:0;z-index:60;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
#mapWrap.fs #map{height:100%!important;border-radius:0}
.fsBtn{position:absolute;bottom:14px;right:12px;z-index:500;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--tx);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center}
#mapWrap.fs .fsBtn{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.fsBtn .ic{width:22px;height:22px}
.msg{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-size:13px;color:var(--tx);user-select:text;-webkit-user-select:text;cursor:text}
.msg:empty{display:none}
.empty,.msg,.row small{user-select:text;-webkit-user-select:text}
#garSel{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:14px}
.sweep{transform-box:view-box;transform-origin:150px 110px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(3);opacity:0}}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0 4px}
.steps div{height:6px;border-radius:3px;background:var(--ln);transition:background .6s}
.steps div.on{background:var(--y)}
.steplbl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10px;color:var(--mu);text-align:center}
.steplbl .on{color:var(--tx);font-weight:700}
.logo{width:44px;height:52px;flex:0 0 auto}
.logo .spin{transform-box:view-box;transform-origin:50px 50px;animation:spin 14s linear infinite}
.hide{display:none!important}
.empty{color:var(--mu);font-size:13px;padding:8px 0}
.stars span{font-size:26px;cursor:pointer;color:var(--ln);transition:transform .2s}
.stars span.on{color:var(--y)}
.stars span:hover{transform:scale(1.2)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#splash{position:fixed;inset:0;background:#0B0F17;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#splash.gone{opacity:0;visibility:hidden}
.slogo{width:130px;height:156px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.slogo .ring{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.2s .3s ease forwards}
.slogo .vehicle{animation:slide 1s .9s cubic-bezier(.2,.8,.3,1) both}
.sname{color:#fff;font-size:36px;font-weight:800;margin-top:16px;letter-spacing:.5px;animation:up .8s 1.3s both}
.sname span{color:#F26B0F}
.stag{color:#9CA3AF;font-size:13px;margin-top:6px;animation:up .8s 1.6s both}
#splash button{margin-top:28px;background:transparent;border:1px solid #F26B0F;color:#F26B0F;padding:8px 18px;border-radius:999px;cursor:pointer;animation:up .8s 2s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slide{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
.menuBtn{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:12px;cursor:pointer;flex:0 0 auto}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--card);color:var(--tx);transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.3,1);z-index:45;overflow-y:auto;padding:16px;box-shadow:4px 0 24px rgba(0,0,0,.3)}
#drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:4px}
.x{background:none;border:0;color:var(--tx);font-size:18px;cursor:pointer}
.dsec{border-top:1px solid var(--ln);padding:12px 0}
.dsec h3{font-size:14px;margin:0 0 6px;color:#B57F00}
#drawer .btn{margin-top:10px}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:repeating-linear-gradient(90deg,transparent 0 58px,rgba(127,127,127,.05) 58px 60px),repeating-linear-gradient(0deg,transparent 0 58px,rgba(127,127,127,.05) 58px 60px)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-4px}
.ibadge{width:38px;height:38px;border-radius:12px;background:rgba(242,107,15,.16);color:#B57F00;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:10px}
.ibadge .ic{width:20px;height:20px}
.card h2{display:flex;align-items:center;font-size:16px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .ibadge{margin:0 0 6px;width:34px;height:34px}
.stars span .ic{width:26px;height:26px;stroke:var(--ln)}
.stars span.on .ic{fill:var(--y);stroke:var(--y)}
.chip .ic{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.btn .ic{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
#splash .ic{display:none}
.pg{display:none}
.pg.show{display:block;animation:pgIn .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes pgIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.pnav{display:flex;gap:8px;padding:10px 12px;max-width:760px;margin:0 auto}
.pnav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:11px 8px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;transition:background .3s,color .3s,transform .2s,box-shadow .3s}
.pnav button:hover{transform:translateY(-1px)}
.pnav button.on{background:var(--y);color:var(--k);border-color:var(--y);box-shadow:0 8px 20px rgba(242,107,15,.35)}
.pnav .ic{width:18px;height:18px;stroke:currentColor}
#pnav.hide{display:none}
#map{height:calc(100vh - 250px)!important;min-height:380px}
.roleRow{display:flex;justify-content:center;padding:12px 12px 0}
.roleRow .seg{width:100%;max-width:440px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px;display:flex;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.roleRow .seg button{flex:1;border:0;background:transparent;color:var(--tx);padding:11px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .3s,color .3s}
.roleRow .seg button.on{background:var(--k);color:#fff}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ln);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--card);transition:background .25s,border-color .25s,box-shadow .25s,transform .2s}
.opt:hover{transform:translateX(3px)}
.opt.on{border-color:var(--y);background:rgba(242,107,15,.12);box-shadow:0 6px 16px rgba(242,107,15,.2)}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);flex:0 0 auto}
.opt.on .radio{border-color:var(--y);background:radial-gradient(circle,var(--y) 45%,transparent 50%)}
.opt small{display:block;color:var(--mu);margin-top:2px}
#garList{max-height:340px;overflow:auto;padding-right:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);background:var(--k);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.2,.8,.3,1);z-index:80;font-size:14px;font-weight:600;max-width:90vw}
.toast.show{transform:translate(-50%,0)}

/* ===== Bolt-style layout ===== */
:root{--tile:#F3F4F6}
@media (prefers-color-scheme: dark){:root{--tile:#1B2430}}
body{background:linear-gradient(120deg,var(--bg),var(--bg2),var(--bg));background-size:300% 300%;animation:bgmove 22s ease infinite;color:var(--tx);font-size:15px}
body::before,.blob{display:none!important}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.04)}}
body::after{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 18% 28%,rgba(242,107,15,.22) 0 110px,transparent 111px),radial-gradient(circle at 84% 74%,rgba(242,107,15,.16) 0 140px,transparent 141px);animation:floaty 12s ease-in-out infinite;z-index:-1;pointer-events:none}
header{background:var(--card);color:var(--tx);box-shadow:none;border-bottom:1px solid var(--ln);padding:12px 16px}
header h1{font-size:19px;font-weight:800}
header h1 span{color:#B57F00}
header small{opacity:.6}
header .seg{background:var(--tile)}
header .seg button{color:var(--tx);font-weight:700}
header .seg button.on{background:var(--k);color:#fff}
.menuBtn{background:var(--tile);color:var(--tx)}
.roleRow{padding:14px 14px 4px}
.roleRow .seg{background:var(--tile);border:0;box-shadow:none}
.roleRow .seg button.on{background:var(--k);color:#fff}
main{padding:14px 14px 110px}
.card{background:var(--tile);border:0;box-shadow:none;border-radius:20px;padding:18px}
.card h2{font-size:19px;font-weight:800;letter-spacing:-.2px;margin-bottom:12px}
.card h2 .ibadge{width:34px;height:34px;border-radius:50%;background:var(--card);margin-right:10px}
.kpi{background:var(--tile);border:0;border-top:0;box-shadow:none;border-radius:18px}
.kpi b{font-size:22px;font-weight:800}
.kpi .ibadge{background:var(--card)}
.opt{border:0;background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:none}
.opt.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--y)}
.chip{border:0;background:var(--card);padding:9px 14px;font-weight:600}
.chip.on{background:var(--k);color:#fff;transform:none}
input,select{border:0;background:var(--card);border-radius:14px;padding:13px 14px}
label{font-weight:600;color:var(--tx);opacity:.7;font-size:12px}
.btn{border-radius:999px;padding:15px;font-weight:800;box-shadow:none;font-size:16px}
.btn.dark{background:var(--k);color:#fff}
.tag{background:var(--card);border:0;font-weight:700}
.tag.y{background:var(--y);color:var(--k)}
.msg{background:var(--card);border:0;border-radius:14px}
.row{border-bottom:0;padding:12px 6px}
#drawer{border-radius:0 24px 24px 0}
.dsec{border-top:0}
.dsec h3{color:var(--tx);font-weight:800}
.toast{border-radius:999px;padding:12px 20px}
/* Bottom tab bar like Bolt: Home / Activity / Account */
.pnav{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln);z-index:30;gap:0}
.pnav button{flex-direction:column;gap:4px;border:0;background:none;box-shadow:none;border-radius:0;padding:6px 4px;color:var(--mu);font-size:12px;font-weight:600;transform:none}
.pnav button:hover{transform:none}
.pnav button.on{background:none;color:var(--tx);box-shadow:none;border:0}
.pnav button.on .ic{stroke:var(--tx);stroke-width:2.4}
.pnav .ic{width:24px;height:24px}
#map{height:calc(100vh - 320px)!important;min-height:340px;border-radius:20px}
.fsBtn{border-radius:14px;background:var(--card)}
.searchBar{width:100%;display:flex;align-items:center;gap:12px;background:var(--tile);border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:800;color:var(--tx);cursor:pointer;margin-bottom:12px;text-align:left}
.searchBar .ic{width:22px;height:22px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{border:0;background:var(--tile);border-radius:18px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--tx);cursor:pointer;transition:transform .2s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{width:26px;height:26px}
.sheet{position:fixed;inset:0;background:var(--card);z-index:75;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.3,1);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 40px}
.sheet.open{transform:none}
.shead{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;margin-bottom:16px}
.fsBtn2{border:0;background:var(--tile);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx)}
.fsBtn2 .ic{width:20px;height:20px}
.sheet .opt{display:flex;align-items:center;gap:12px;font-weight:600}
.sheet .btn{margin-top:14px}
.muted{color:var(--mu)}
.offerBanner{background:#5B5FEA;color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.offerBanner small{opacity:.85}
.offerCard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.offerCard.on{box-shadow:inset 0 0 0 2px var(--y)}

/* ===== Themes and readable sizes ===== */
:root:root{--y:#F26B0F;--card:#FFFFFF;--bg:#FFFFFF;--tx:#0B0F17;--mu:#4B5563;--tile:#F4F5F7;--ln:#E8EAEE;--k:#0B0F17;--kt:#FFFFFF}
:root[data-theme=yk]{--card:#0B0F17;--bg:#0B0F17;--tx:#FFFFFF;--mu:#C9CED6;--tile:#1C2431;--ln:#2E3A4D;--k:#F26B0F;--kt:#0B0F17}
body{font-size:17px;line-height:1.5}
header h1{font-size:23px}
header small{font-size:13px}
.card h2{font-size:22px}
.card h2 .ibadge{width:40px;height:40px}
.row b,.opt,.chip,.btn,input,select{font-size:17px}
.row small,small,.muted,.msg,.empty{font-size:15px}
label{font-size:15px;opacity:.85}
.kpi b{font-size:28px}
.kpi span{font-size:15px}
.tile{font-size:14px}
.tile .ic{width:28px;height:28px}
.pnav button{font-size:14px}
.searchBar{font-size:19px}
.shead{font-size:26px}
.btn{font-size:18px;padding:16px}
.btn.dark,.chip.on,.roleRow .seg button.on,header .seg button.on{background:var(--k);color:var(--kt)}
.pnav button.on .ic{stroke:var(--tx)}
header .seg button{font-size:14px}
.roleRow .seg button{font-size:16px}
.tag{font-size:14px}
.offerBanner b{font-size:19px}
.dash .tile{background:var(--tile);color:var(--tx)}
.dash .tile .ic{stroke:var(--tx)}
.recentRow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--tile);margin-bottom:8px;cursor:pointer}
.recentRow b{font-size:17px}
.mhead{display:flex;align-items:center;gap:12px;padding:10px 0 12px;font-size:18px}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--ln);font-size:17px;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow b{flex:1}
#drawer{width:min(360px,88vw);padding:18px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mtile{border:0;background:var(--tile);color:var(--tx);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.mtile .ic{width:28px;height:28px}

/* ===== Theme contrast (text always readable) ===== */
:root:root{--bg2:#FFF6DB}
:root[data-theme=yk]{--bg2:#1A2230}
html,body{color:var(--tx)}
input,select,textarea{color:var(--tx);background:var(--card);border:1px solid var(--ln)}
select option{background:var(--card);color:var(--tx)}
.card,.row,.opt,.mrow,.mtile,.kpi,.tile,.offerCard,.recentRow{color:var(--tx)}
.card h2,.row b,.mrow b,.mtile span,.tile span,.kpi b{color:var(--tx)}

function locate(){
  if(!navigator.geolocation){ gpsFallback(); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude};
    $('loc').value=me.lat.toFixed(4)+', '+me.lng.toFixed(4);
    $('gpsMsg').textContent=t('gpsOk'); renderAll(); updatePlace();
  },gpsFallback,{timeout:8000});
}

const GEO_CACHE=new Map();
async function placeName(lat,lng){
  const key=lat.toFixed(4)+','+lng.toFixed(4);
  if(GEO_CACHE.has(key)) return GEO_CACHE.get(key);
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=sw&lat='+lat+'&lon='+lng);
    const j=await r.json(); const a=j.address||{};
    const parts=[a.road||a.pedestrian||a.neighbourhood||a.suburb, a.suburb||a.neighbourhood||a.village, a.city||a.town||a.county].filter(Boolean);
    const name=[...new Set(parts)].slice(0,2).join(', ') || j.display_name || key;
    GEO_CACHE.set(key,name); return name;
  }catch(e){ return key; }
}

let lmap=null, lgroup=null, lme=null, ovl=null, trailLine=null;
const RT={}, RTP={};
function getRoute(a,b){
  const k=[a.lat,a.lng,b.lat,b.lng].map(v=>v.toFixed(3)).join(',');
  if(RT[k]) return RT[k];
  const straight={pts:[[a.lat,a.lng],[b.lat,b.lng]],road:false};
  if(navigator.onLine!==false && !RTP[k]){
    RTP[k]=1;
    fetch('https://router.project-osrm.org/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson')
      .then(r=>r.json()).then(j=>{
        const c=j.routes&&j.routes[0]&&j.routes[0].geometry.coordinates;
        if(c&&c.length>1){ RT[k]={pts:c.map(q=>[q[1],q[0]]),road:true}; drawOverlays(); updDist(); }
      }).catch(()=>{});
  }
  return straight;
}
function alongPath(pts,f){
  const tot=pathLen(pts)||0.0001, target=tot*Math.min(1,Math.max(0,f));
  let acc=0,i=1;
  for(;i<pts.length;i++){ const seg=hav({lat:pts[i-1][0],lng:pts[i-1][1]},{lat:pts[i][0],lng:pts[i][1]}); if(acc+seg>=target) break; acc+=seg; }
  if(i>=pts.length){ const l=pts[pts.length-1]; return {lat:l[0],lng:l[1],rest:[],left:0,tot}; }
  const a=pts[i-1],b=pts[i],seg=hav({lat:a[0],lng:a[1]},{lat:b[0],lng:b[1]})||1e-6,t=(target-acc)/seg;
  const lat=a[0]+(b[0]-a[0])*t, lng=a[1]+(b[1]-a[1])*t;
  return {lat,lng,rest:pts.slice(i),left:tot-target,tot};
}
function curActive(){ return reqs.find(r=>r.st>=1&&r.st<=3&&r.lat!=null); }
function mechState(r){
  const g=GARAGES.find(x=>x.id===r.g)||GARAGES[0];
  const rt=getRoute({lat:g.lat,lng:g.lng},{lat:r.lat,lng:r.lng});
  const f=r.st>=3?1:(r.prog||0);
  return {g,rt,m:alongPath(rt.pts,f)};
}
function drawOverlays(){
  if(!lmap||!ovl) return;
  const W=window.L;
  if(trailLine) trailLine.setLatLngs(trail.map(p=>[p.lat,p.lng]));
  ovl.clearLayers();
  const info=$('mapInfo'); let html='';
  const cur=curActive(), u=pos();
  if(cur){
    const {g,rt,m}=mechState(cur);
    W.polyline(rt.pts,{color:'#111',weight:5,opacity:.28}).addTo(ovl);
    W.polyline([[m.lat,m.lng],...m.rest],{className:'flow',color:'#F26B0F',weight:6,opacity:1}).addTo(ovl);
    W.marker([m.lat,m.lng],{icon:W.divIcon({className:'',html:'<div class="mech">'+ic('car')+'</div>',iconSize:[40,40],iconAnchor:[20,20]}),zIndexOffset:900}).addTo(ovl);
    W.circleMarker([cur.lat,cur.lng],{radius:13,color:'#F26B0F',weight:3,fillOpacity:0}).addTo(ovl);
    if(m.left>0.02){
      const mid=alongPath([[m.lat,m.lng],...m.rest],.5);
      W.marker([mid.lat,mid.lng],{interactive:false,icon:W.divIcon({className:'',html:'<div class="kmTag">'+fmtKm(m.left)+'</div>',iconSize:[0,0]})}).addTo(ovl);
    }
    html=cur.st>=3?'<span>'+ic('check')+'</span><div>'+esc(g.name)+'<small>'+L('Fundi amefika','Mechanic has arrived')+'</small></div>'
      :'<span>'+ic('car')+'</span><div>'+esc(g.name)+' · '+fmtKm(m.left)+'<small>'+L('Fundi anakuja · takriban dakika ','Mechanic coming · about ')+etaMin(m.left)+(lang==='sw'?'':' min')+'</small></div>';
  } else if(garSel){
    const g=GARAGES.find(x=>x.id===garSel);
    if(g){
      const rt=getRoute(u,{lat:g.lat,lng:g.lng}), len=pathLen(rt.pts);
      W.polyline(rt.pts,{color:'#111',weight:5,opacity:.28}).addTo(ovl);
      W.polyline(rt.pts,{className:'flow',color:'#F26B0F',weight:6,opacity:1}).addTo(ovl);
      const mid=alongPath(rt.pts,.5);
      W.marker([mid.lat,mid.lng],{interactive:false,icon:W.divIcon({className:'',html:'<div class="kmTag">'+(rt.road?'':'~')+fmtKm(len)+'</div>',iconSize:[0,0]})}).addTo(ovl);
      html='<span>'+ic('pin')+'</span><div>'+esc(g.name)+' · '+(rt.road?'':'~')+fmtKm(len)+'<small>'+L('Umbali wa njia · takriban dakika ','Route distance · about ')+etaMin(len)+(lang==='sw'?'':' min')+'</small></div>';
    }
  }
  if(info){ info.innerHTML=html; info.style.display=html?'flex':'none'; }
}
function updDist(){
  const el=$('distLine'); if(!el) return;
  const cur=curActive(); if(!cur){ el.innerHTML=''; return; }
  const {m}=mechState(cur);
  el.innerHTML=cur.st>=3?ic('check')+'<span>'+L('Fundi amefika','Mechanic has arrived')+'</span>'
    :ic('car')+'<span>'+L('Fundi yuko ','Mechanic is ')+'<b>'+fmtKm(m.left)+'</b>'+L(' kutoka kwako',' away')+'<small> · '+L('~dakika ','~')+etaMin(m.left)+(lang==='sw'?'':' min')+'</small></span>';
}
// Fundi anasogea kuelekea mteja (demo). Katika mfumo halisi nafasi hii inatoka kwenye GPS ya fundi.
setInterval(()=>{
  let ch=false;
  reqs.forEach(r=>{ if(r.st===1||r.st===2){ r.prog=Math.min(1,(r.prog||0)+.012); ch=true; } });
  if(ch){ drawOverlays(); updDist();}
},1000);

function renderRadar(){
  if(typeof window.L==='undefined'){ document.getElementById('map').innerHTML='<p style="padding:16px">Leaflet haijapakia. Unganisha intaneti mara moja ili ihifadhiwe kwa matumizi ya offline.</p>'; return; }
  const u=pos();
  if(!lmap){
    lmap=window.L.map('map',{zoomControl:true}).setView([u.lat,u.lng],14);
    const sat=window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics'});
    const street=window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
    let tileErr=0;
    const onErr=()=>{ if(++tileErr===8) $('gpsMsg').textContent=L('Ramani haipakii. Angalia intaneti (offline unaona maeneo uliyowahi kufungua tu).','Map tiles unavailable. Check internet (offline shows only areas you opened before).'); };
    sat.on('tileerror',onErr); street.on('tileerror',onErr);
    street.addTo(lmap);
    window.L.control.layers({'Mitaa (street)':street,'Earth (satellite)':sat},null,{position:'topright'}).addTo(lmap);
    lgroup=window.L.layerGroup().addTo(lmap);
    ovl=window.L.layerGroup().addTo(lmap);
    trailLine=window.L.polyline([],{color:'#2563EB',weight:5,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(lmap);
    if(!$('mapInfo')){ const d=document.createElement('div'); d.id='mapInfo'; $('mapWrap').appendChild(d); }
    const pts=GARAGES.map(g=>[g.lat,g.lng]); pts.push([u.lat,u.lng]);
    lmap.fitBounds(window.L.latLngBounds(pts).pad(0.15));
  }
  lgroup.clearLayers();
  sorted().forEach(g=>{
    const s=garSel===g.id;
    window.L.circleMarker([g.lat,g.lng],{radius:s?11:8,color:'#fff',weight:2,fillColor:s?'#111':'#F26B0F',fillOpacity:1})
      .bindTooltip(g.name+' · '+fmtKm(g.d)).on('click',()=>pick(g.id)).addTo(lgroup);
  });
  if(me){
    if(!lme){ lme=window.L.circleMarker([me.lat,me.lng],{radius:9,color:'#fff',weight:3,fillColor:'#2563EB',fillOpacity:1}).addTo(lmap); lmap.setView([me.lat,me.lng],14); }
    else lme.setLatLng([me.lat,me.lng]);
  }
  drawOverlays();
}
function pick(id){
  garSel=id; const g=GARAGES.find(x=>x.id===id);
  if(g&&lmap){ if(me) lmap.fitBounds(window.L.latLngBounds([[me.lat,me.lng],[g.lat,g.lng]]).pad(0.35),{animate:true}); else lmap.flyTo([g.lat,g.lng],16,{duration:0.9}); }
  renderAll();
}

function renderGarages(){
  $('garList').innerHTML=sorted().map(g=>`<div class="opt ${garSel===g.id?'on':''}" onclick="pick(${g.id})">
    <span class="radio"></span>
    <div><b>${esc(g.name)}</b>${g.h24?' <span class="tag g">24h</span>':''}<small>${g.d.toFixed(1)} ${t('km')}${g.phone?' · '+esc(g.phone):''}</small></div></div>`).join('');
}
function renderChips(){
  $('issueChips').innerHTML=Object.keys(PRICE).map(k=>`<span class="chip ${issue===k?'on':''}" onclick="setIssue('${k}')">${ic(ICON_OF[k])}${t('issues')[k]} · ${fmt(PRICE[k])}</span>`).join('');
}
function setIssue(k){issue=k;renderAll();}

function sendReq(){
  if(!garSel){ garSel=sorted()[0].id; renderGarages(); }
  if(!$('loc').value.trim()){$('reqMsg').textContent=t('writeLoc');return;}
  reqs.unshift({id:nid++,issue,car:$('car').value.trim(),loc:$('loc').value.trim(),g:garSel,st:0,price:PRICE[issue],photo:photoURL,lat:pos().lat,lng:pos().lng});
  photoURL=null; $('pPrev').classList.add('hide');
  $('reqMsg').textContent=t('sent');
  renderAll();
  toast(t('sent'));
  showPage('order');
  setTimeout(()=>$('trackCard').scrollIntoView({behavior:'smooth',block:'start'}),150);
}
function cancelReq(id){const r=reqs.find(x=>x.id===id); if(r){r.st=-1;} renderAll();}
function advance(id){const r=reqs.find(x=>x.id===id); if(!r) return; if(r.st===0){r.st=1;r.g=r.g||MYG;} else if(r.st<4) r.st++; renderAll();}
function accept(id){const r=reqs.find(x=>x.id===id); if(r){r.st=1;r.g=r.g||MYG;} renderAll(); if(r) focusCustomer(r);}
function toggleOnline(){online=!online;renderAll();}
function rate(id,n){const r=reqs.find(x=>x.id===id); if(r){r.rating=n;} renderAll();}

function stepper(st){
  return `<div class="steps">${t('st').map((_,i)=>`<div class="${i<=st?'on':''}"></div>`).join('')}</div>
  <div class="steplbl">${t('st').map((s,i)=>`<span class="${i===st?'on':''}">${s}</span>`).join('')}</div>`;
}
function gName(id){const g=GARAGES.find(x=>x.id===id);return g?g.name:'';}

function renderOwner(){
  const active=reqs.filter(r=>r.st>=0&&r.st<4).length, done=reqs.filter(r=>r.st===4);
  $('o1').textContent=active; $('o2').textContent=done.length; $('o3').textContent=fmt(done.reduce((s,r)=>s+r.price,0));
  renderRadar(); renderGarages(); renderChips();
  const cur=reqs.find(r=>r.st>=0&&r.st<4);
  $('track').className='';
  $('track').innerHTML=cur?`
    <b>${t('issues')[cur.issue]}</b>${cur.car?' · '+esc(cur.car):''}<div class="empty">${ic('pin')} ${esc(cur.loc)}</div><div class="empty">${esc(gName(cur.g))} · ${fmt(cur.price)} TZS</div>
    ${cur.st>=1?'<div class="distLine" id="distLine"></div>':''}
    ${cur.photo?`<img src="${cur.photo}" alt="" style="width:100%;border-radius:12px;margin:8px 0">`:''}
    ${stepper(cur.st)}
    <div style="margin-top:6px;font-weight:700">${t('st')[cur.st]}</div>
    ${cur.st===0?`<button class="btn dark" onclick="cancelReq(${cur.id})">${t('cancel')}</button>`:''}`:`<span class="empty">${t('noReq')}</span>`;
  const hist=reqs.filter(r=>r.st===4||r.st<0);
  $('hist').innerHTML=hist.length?hist.map(r=>`<div class="row"><div><b>${t('issues')[r.issue]}</b><small>${esc(gName(r.g))}</small></div>
      ${r.st===4?`<button class="tag y" style="cursor:pointer;border:0" onclick="rebook(${r.id})">${t('rebook')}</button>`:''}
    ${r.st===4?`<div class="stars">${[1,2,3,4,5].map(n=>`<span class="${(r.rating||0)>=n?'on':''}" onclick="rate(${r.id},${n})">${ic('star')}</span>`).join('')}</div>`:`<span class="tag">${t('cancel')}</span>`}</div>`).join(''):`<span class="empty">—</span>`;
}

function renderGarage(){
  $('g1').textContent=reqs.filter(r=>r.st===0).length;
  const done=reqs.filter(r=>r.st===4);
  $('g2').textContent=done.length; $('g3').textContent=fmt(done.reduce((s,r)=>s+r.price,0));
  $('onlineBtn').textContent=online?t('online'):t('offline');
  $('onlineBtn').style.background=online?'var(--y)':'var(--ln)';
  const inc=reqs.filter(r=>r.st===0);
  if(inc.length>lastInc) toast(t('newReq'));
  lastInc=inc.length;
  $('incoming').innerHTML=!online?`<span class="empty">${t('offline')}</span>`:inc.length?inc.map(r=>`
    <div class="row"><div><b>${t('issues')[r.issue]}</b> <span class="tag">${fmt(r.price)} TZS</span><small>${esc(r.loc)}${r.car?' · '+esc(r.car):''}</small></div>
    <button class="btn" style="width:auto;margin:0;padding:9px 14px" onclick="accept(${r.id})">${t('accept')}</button></div>`).join(''):`<span class="empty">${t('noInc')}</span>`;
  const jobs=reqs.filter(r=>r.st>=1&&r.st<=4);
  $('jobs').innerHTML=jobs.length?jobs.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--ln)">
    <div class="row" style="padding:0;border:0"><div><b>${t('issues')[r.issue]}</b><small>${esc(r.loc)}</small></div><span class="tag y">${t('st')[r.st]}</span></div>
    ${stepper(r.st)}
    <button class="tag y" style="cursor:pointer;border:0;margin:8px 0" onclick="focusById(${r.id})">${ic('pin')} ${t('focus')}</button>
    ${r.st<4?`<button class="btn dark" onclick="advance(${r.id})">${t('next')} →</button>`:`<span class="tag g">${t('done')}</span>`}</div>`).join(''):`<span class="empty">${t('noJobs')}</span>`;
}

function saveState(){ try{ localStorage.setItem('gf_reqs',JSON.stringify(reqs.map(r=>({...r,photo:null})))); localStorage.setItem('gf_nid',String(nid)); }catch(e){} }
function renderAll(){ renderOwner(); renderGarage(); renderDrawer(); renderGMap(); renderTiles(); renderAccount(); updDist(); saveState(); }
let gmap=null, ggroup=null;
function renderGMap(){
  if(typeof window.L==='undefined') return;
  if(!gmap){
    gmap=window.L.map('gmap').setView([DEF.lat,DEF.lng],13);
    window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(gmap);
    ggroup=window.L.layerGroup().addTo(gmap);
    setTimeout(()=>gmap.invalidateSize(),150);
  }
  ggroup.clearLayers();
  GARAGES.filter(g=>g.pub!==false).forEach(g=>window.L.circleMarker([g.lat,g.lng],{radius:7,color:'#fff',weight:2,fillColor:'#F26B0F',fillOpacity:1}).bindTooltip(g.name).addTo(ggroup));
  const myg=GARAGES.find(x=>x.id===MYG);
  reqs.filter(r=>r.st>=0&&r.st<=3&&r.g===MYG&&r.lat!=null).forEach(r=>{
    if(myg&&r.st>=1){ window.L.polyline([[myg.lat,myg.lng],[r.lat,r.lng]],{className:'flow',color:'#F26B0F',weight:5}).addTo(ggroup); }
    const km=myg?hav(myg,{lat:r.lat,lng:r.lng}):0;
    window.L.circleMarker([r.lat,r.lng],{radius:10,color:'#fff',weight:3,fillColor:'#2563EB',fillOpacity:1}).bindTooltip(t('issues')[r.issue]+' · '+r.loc+' · '+fmtKm(km)).addTo(ggroup);
  });
}
function focusCustomer(r){
  renderGMap();
  $('gFocus').textContent = t('focus')+': '+r.loc;
  if(r.lat!=null) placeName(r.lat,r.lng).then(n=>{ if(/^\s*-?\d/.test(r.loc)) r.loc=n; $('gFocus').textContent=t('focus')+': '+r.loc; });
  if(!gmap || r.lat==null) return;
  const go=()=>{ gmap.invalidateSize(); gmap.setView([r.lat,r.lng],17,{animate:true}); };
  go(); setTimeout(go,300); setTimeout(go,800);
}
function focusById(id){ const r=reqs.find(x=>x.id===id); if(r) focusCustomer(r); }

document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>setRole(b.dataset.r));
let profile=null;
function toggleMenu(){ $('drawer').classList.toggle('open'); $('scrim').classList.toggle('open'); renderDrawer(); }
function renderDrawer(){
  const name=profile?profile.name:L('Mgeni','Guest');
  const items=[
    ['user',L('Jisajili','Sign up'),'sSignup'],
    ['user',L('Wasifu','Profile'),'sProfile'],
    ['wallet',L('Malipo','Payment'),'sPay'],
    ['help',L('Msaada','Support'),'sSupport'],
    ['shield',L('Usalama','Safety'),'sSafety'],
    ['pin',L('Maeneo','Saved places'),'sPlaces'],
    ['gift',L('Promotions','Promotions'),'sPromo'],
    ['car',L('Jiunge kama fundi','Earn with GariFix'),'sEarn'],
    ['briefcase',L('Kazi','Work profile'),'sWork'],
    ['users',L('Familia','Family profile'),'sFamily'],
    ['shield',L('Msimamizi','Admin'),'sAdmin'],
    ['lang',L('Mipangilio','Settings'),'sSettings']
  ];
  $('menuList').innerHTML=
    `<div class="mhead"><span class="ibadge">${ic('user')}</span><div><b>${esc(name)}</b><small class="muted">★ 4.8</small></div></div>`+
    `<div class="mgrid">`+items.map(i=>`<button class="mtile" onclick="openSheet(${i[2]})">${ic(i[0])}<span>${i[1]}</span></button>`).join('')+`</div>`;
}
function saveProfile(){
  const n=$('pName').value.trim(), p=$('pPhone').value.trim(), c=$('pCar').value.trim(), e=$('pEmail').value.trim();
  if(!n||!p){ $('regMsg').textContent=t('needname'); return; }
  profile={name:n,phone:p,car:c,email:e};
  if(c && !$('car').value.trim()) $('car').value=c;
  $('regMsg').textContent=t('f_saved');
  renderDrawer();
}
let curPage='map';
function showPage(p){
  curPage=p;
  document.querySelectorAll('.pg').forEach(x=>x.classList.toggle('show',x.dataset.pg===p));
  document.querySelectorAll('#pnav button').forEach((b,i)=>b.classList.toggle('on',['map','order','hist','acc'][i]===p));
  if(p==='map' && lmap) setTimeout(()=>lmap.invalidateSize(),80);
}
function toggleFs(){
  const w=$('mapWrap'); const on=w.classList.toggle('fs');
  w.querySelector('.fsBtn').innerHTML=ic(on?'shrink':'expand');
  if(lmap) setTimeout(()=>{ lmap.invalidateSize(); if(on){ const pts=GARAGES.map(g=>[g.lat,g.lng]); if(me) pts.push([me.lat,me.lng]); lmap.fitBounds(window.L.latLngBounds(pts).pad(0.15)); } },80);
}
function hideSplash(){ const sp=document.getElementById('splash'); if(!sp) return; sp.classList.add('gone'); setTimeout(()=>sp.remove(),700); }
setTimeout(hideSplash,3800);
// start the app after all declarations
try{
  const a=JSON.parse(localStorage.getItem('gf_reqs')||'[]');
  if(Array.isArray(a)&&a.length){ reqs=a; nid=Math.max(...a.map(r=>r.id||0))+1; }
  const tr=JSON.parse(localStorage.getItem('gf_trail')||'[]'); if(Array.isArray(tr)) trail=tr;
}catch(e){}
document.documentElement.dataset.theme=curTheme;
applyLang();
locate();
startWatch();
showPage('map');

/* ===== PWA: service worker, install, offline ===== */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let defP=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function showInst(){
  let dis=false; try{dis=localStorage.getItem('gf_inst_x')==='1';}catch(e){}
  if(isStandalone()||dis) return;
  $('instTxt').textContent=L('Sakinisha GariFix kwenye simu yako','Install GariFix on your phone');
  $('instBtn').textContent=L('Sakinisha','Install');
  $('installBar').classList.remove('hide');
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); defP=e; showInst(); });
window.addEventListener('appinstalled',()=>{ $('installBar').classList.add('hide'); toast(L('GariFix imesakinishwa','GariFix installed')); });
$('instBtn').onclick=async()=>{
  if(defP){ defP.prompt(); try{await defP.userChoice;}catch(e){} defP=null; $('installBar').classList.add('hide'); }
  else toast(L('Bonyeza Share, kisha "Add to Home Screen"','Tap Share, then "Add to Home Screen"'));
};
$('instX').onclick=()=>{ $('installBar').classList.add('hide'); try{localStorage.setItem('gf_inst_x','1');}catch(e){} };
if(isIOS) showInst();
function netUI(){
  const b=$('netBar');
  if(navigator.onLine===false){ b.textContent=L('Uko offline — unatumia data iliyohifadhiwa','You are offline — using saved data'); b.classList.remove('hide'); }
  else b.classList.add('hide');
}
window.addEventListener('offline',netUI);
window.addEventListener('online',()=>{ netUI(); toast(L('Umerudi online','Back online')); renderAll(); });
netUI();
